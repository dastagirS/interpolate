name: Quality gate

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    name: Linux x86-64 battle tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build and test dependencies
        run: scripts/install-ci-dependencies.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-linux-x86_64
          key: native-${{ hashFiles('build.rs', 'native/**') }}
          cache-workspace-crates: true
          cache-on-failure: false

      - name: Configure software Vulkan
        run: scripts/configure-ci-vulkan.sh

      - name: Run battle tests
        env:
          CI: "true"
          QUALITY_GATE_PROFILE: release
        run: scripts/quality-gate.sh
