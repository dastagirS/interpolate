name: Release Linux build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure release metadata
        env:
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$MANUAL_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          test -n "$release_tag"
          test "${#release_tag}" -le 64
          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo 'Release tag must start with v and contain only letters, numbers, dots, underscores, or hyphens.' >&2
            exit 1
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=interpolate-${release_tag}-linux-x86_64" >> "$GITHUB_ENV"

      - name: Stop if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_REPOSITORY"
          test -n "$RELEASE_TAG"
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            >/dev/null 2>"$error_file"; then
            echo "Release ${RELEASE_TAG} already exists; stopping before the build." >&2
            exit 1
          fi
          if ! grep -q 'HTTP 404' "$error_file"; then
            cat "$error_file" >&2
            echo 'Could not determine whether the release already exists.' >&2
            exit 1
          fi

      - name: Install build dependencies
        run: scripts/install-ci-dependencies.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-linux-x86_64
          key: native-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build.rs', 'native/**') }}
          cache-workspace-crates: true
          cache-on-failure: false

      - name: Configure software Vulkan
        run: scripts/configure-ci-vulkan.sh

      - name: Run release-blocking battle tests
        env:
          CI: "true"
          QUALITY_GATE_PROFILE: release
        run: scripts/quality-gate.sh

      - name: Build release
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
        run: |
          set -euo pipefail
          memory_available_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          memory_required_kib=$((5 * 1024 * 1024))
          test -n "$memory_available_kib"
          test "$memory_available_kib" -ge "$memory_required_kib"
          ulimit -v $((6 * 1024 * 1024))
          cargo build --release --locked --jobs 1
          test -x target/release/interpolate
          test -s target/release/interpolate

      - name: Package release
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          test -n "$ARCHIVE_NAME"
          archive_name="$ARCHIVE_NAME"
          package_root="dist/${archive_name}"

          mkdir -p \
            "$package_root/models/rife-v4.25" \
            "$package_root/share/applications" \
            artifacts
          install -m 0755 target/release/interpolate "$package_root/interpolate"
          install -m 0644 packaging/interpolate.desktop \
            "$package_root/share/applications/interpolate.desktop"
          install -m 0644 models/rife-v4.25/flownet.param \
            "$package_root/models/rife-v4.25/flownet.param"
          install -m 0644 models/rife-v4.25/flownet.bin \
            "$package_root/models/rife-v4.25/flownet.bin"
          install -m 0644 README.md LICENSE "$package_root/"

          test -x "$package_root/interpolate"
          grep -Fq 'Terminal=false' "$package_root/share/applications/interpolate.desktop"
          if head -c 2 "$package_root/interpolate" | grep -q '^#!'; then
            echo 'Release launcher must be the GUI executable, not a shell script.' >&2
            exit 1
          fi
          if ldd "$package_root/interpolate" | grep -q 'libinterpolate_backend'; then
            echo 'GUI executable must statically contain the native backend.' >&2
            exit 1
          fi

          ldd "$package_root/interpolate" | tee dist/ldd.txt
          if grep -q 'not found' dist/ldd.txt; then
            echo 'Packaged executable has unresolved shared libraries.' >&2
            exit 1
          fi

          tar --create --gzip --directory dist --file "artifacts/${archive_name}.tar.gz" "$archive_name"
          sha256sum "artifacts/${archive_name}.tar.gz" > "artifacts/${archive_name}.tar.gz.sha256"
          test -s "artifacts/${archive_name}.tar.gz"
          test -s "artifacts/${archive_name}.tar.gz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          test -s "artifacts/${ARCHIVE_NAME}.tar.gz"
          gh release create "$RELEASE_TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
