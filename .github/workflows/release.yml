name: Release Linux build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure release metadata
        env:
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$MANUAL_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          test -n "$release_tag"
          test "${#release_tag}" -le 64
          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo 'Release tag must start with v and contain only letters, numbers, dots, underscores, or hyphens.' >&2
            exit 1
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=interpolate-${release_tag}-linux-x86_64" >> "$GITHUB_ENV"

      - name: Stop if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_REPOSITORY"
          test -n "$RELEASE_TAG"
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            >/dev/null 2>"$error_file"; then
            echo "Release ${RELEASE_TAG} already exists; stopping before the build." >&2
            exit 1
          fi
          if ! grep -q 'HTTP 404' "$error_file"; then
            cat "$error_file" >&2
            echo 'Could not determine whether the release already exists.' >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            ffmpeg \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xinput-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            pkg-config \
            vulkan-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Configure software Vulkan
        run: |
          set -euo pipefail
          shopt -s nullglob
          lavapipe_icd_files=(
            /usr/share/vulkan/icd.d/lvp_icd*.json
            /etc/vulkan/icd.d/lvp_icd*.json
          )
          test "${#lavapipe_icd_files[@]}" -ge 1
          test "${#lavapipe_icd_files[@]}" -le 4
          lavapipe_icd_file="${lavapipe_icd_files[0]}"
          test -r "$lavapipe_icd_file"
          echo "VK_ICD_FILENAMES=$lavapipe_icd_file" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$lavapipe_icd_file" vulkaninfo --summary

      - name: Run release-blocking battle tests
        env:
          CI: "true"
        run: scripts/quality-gate.sh

      - name: Build release
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
        run: |
          set -euo pipefail
          memory_available_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          memory_required_kib=$((5 * 1024 * 1024))
          test -n "$memory_available_kib"
          test "$memory_available_kib" -ge "$memory_required_kib"
          ulimit -v $((6 * 1024 * 1024))
          cargo build --release --locked --jobs 1
          test -x target/release/interpolate
          test -s target/release/interpolate

      - name: Package release
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          test -n "$ARCHIVE_NAME"
          archive_name="$ARCHIVE_NAME"
          package_root="dist/${archive_name}"

          mapfile -t backend_libraries < <(find target/release/build \
            -path '*/out/native-build/libinterpolate_backend.so' -type f -print)
          test "${#backend_libraries[@]}" -eq 1
          test -s "${backend_libraries[0]}"

          mkdir -p \
            "$package_root/bin" \
            "$package_root/lib" \
            "$package_root/share/interpolate/models/rife-v4.25" \
            artifacts
          install -m 0755 target/release/interpolate "$package_root/bin/interpolate"
          install -m 0755 "${backend_libraries[0]}" "$package_root/lib/libinterpolate_backend.so"
          install -m 0644 models/rife-v4.25/flownet.param \
            "$package_root/share/interpolate/models/rife-v4.25/flownet.param"
          install -m 0644 models/rife-v4.25/flownet.bin \
            "$package_root/share/interpolate/models/rife-v4.25/flownet.bin"
          install -m 0644 README.md LICENSE "$package_root/"

          cat > "$package_root/interpolate" <<'LAUNCHER'
          #!/bin/sh
          set -eu
          installation_root=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          test -n "$installation_root"
          test -x "$installation_root/bin/interpolate"
          export LD_LIBRARY_PATH="$installation_root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$installation_root/bin/interpolate" "$@"
          LAUNCHER
          chmod 0755 "$package_root/interpolate"

          LD_LIBRARY_PATH="$package_root/lib" ldd "$package_root/bin/interpolate" | tee dist/ldd.txt
          if grep -q 'not found' dist/ldd.txt; then
            echo 'Packaged executable has unresolved shared libraries.' >&2
            exit 1
          fi

          tar --create --gzip --directory dist --file "artifacts/${archive_name}.tar.gz" "$archive_name"
          sha256sum "artifacts/${archive_name}.tar.gz" > "artifacts/${archive_name}.tar.gz.sha256"
          test -s "artifacts/${archive_name}.tar.gz"
          test -s "artifacts/${archive_name}.tar.gz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          test -s "artifacts/${ARCHIVE_NAME}.tar.gz"
          gh release create "$RELEASE_TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
